name: Build Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  platformio:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - lolin_s2_mini
          - esp32dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags so scripts/version.py can `git describe`.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ matrix.environment }}-
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Stage firmware binary
        run: |
          mkdir -p dist
          cp ".pio/build/${{ matrix.environment }}/firmware.bin" \
             "dist/firmware-${{ matrix.environment }}.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: dist/firmware-${{ matrix.environment }}.bin

  release:
    # Publishes the per-board .bin files to a GitHub Release on tag push.
    # The on-device self-updater reads /releases/latest and downloads the asset
    # matching its board (firmware-<env>.bin).
    needs: platformio
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/firmware-*.bin
          generate_release_notes: true
