[platformio]
default_envs = lolin_s2_mini

[env]
; Pinned to the 6.x line (arduino-esp32 2.0.x). Blocks the silent jump to
; espressif32 7.x (arduino-esp32 3.x / ESP-IDF 5.x), which is a deliberate
; migration: it changes WiFi.setHostname() ordering, may break the WebSockets
; and ESP32Encoder libs, and produces larger binaries. Bump intentionally.
platform = espressif32@^6.13.0
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
; Dual-app OTA layout (ota_0 + ota_1, ~1.25 MB each) on the 4 MB modules.
board_build.partitions = default.csv
; Inject FIRMWARE_VERSION from the current git tag (see scripts/version.py).
extra_scripts = pre:scripts/version.py
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFiClientSecure/src
lib_deps =
  olikraus/U8g2 @ ^2.35.19
  links2004/WebSockets @ ^2.6.1
  madhephaestus/ESP32Encoder @ ^0.11.7

[env:lolin_s2_mini]
board = lolin_s2_mini
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DOTA_ASSET=\"firmware-lolin_s2_mini.bin\"

[env:esp32dev]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DOTA_ASSET=\"firmware-esp32dev.bin\"
