[platformio]
default_envs = lolin_s2_mini

[env]
; Official espressif32 7.x. NOTE: as of 7.0.1 this platform STILL bundles
; arduino-esp32 2.0.17 (not 3.x) — verified via ESP_ARDUINO_VERSION. So this is
; only a platform-tooling bump (esptool, board defs), NOT a core/IDF5 migration;
; the binary is byte-for-byte comparable to the 6.13.0 build (~78% of OTA slot).
; A real arduino-esp32 3.x / ESP-IDF 5.x upgrade requires the community
; "pioarduino" platform fork, which is a separate, deliberate decision.
; WiFi.setHostname() is called before+after WiFi.mode() to stay correct on both.
platform = espressif32@^7.0.0
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
; Dual-app OTA layout (ota_0 + ota_1, ~1.25 MB each) on the 4 MB modules.
board_build.partitions = default.csv
; Inject FIRMWARE_VERSION from the current git tag (see scripts/version.py).
extra_scripts = pre:scripts/version.py
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFiClientSecure/src
lib_deps =
  olikraus/U8g2 @ ^2.35.19
  links2004/WebSockets @ ^2.6.1
  madhephaestus/ESP32Encoder @ ^0.11.7

[env:lolin_s2_mini]
board = lolin_s2_mini
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DOTA_ASSET=\"firmware-lolin_s2_mini.bin\"

[env:esp32dev]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DOTA_ASSET=\"firmware-esp32dev.bin\"
